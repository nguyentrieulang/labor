[project]
name = "labour"
version = "1.1.post3"
description = "Labour – đội AI agent trên Telegram"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.13,<4",
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.13",
    "pydantic>=2.7,<3",
    "PyYAML>=6",
    "jsonschema>=4",
    "python-docx>=1.1",
    "pywin32>=306; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["labour"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
